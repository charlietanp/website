<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Mengatur karakter agar teks terbaca dengan benar -->
  <meta charset="UTF-8">
  <title>Login | Abidin Tech International</title>
  <!-- Membuat tampilan responsif di HP, tablet, dan laptop -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Memanggil Bootstrap untuk desain dan layout -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Memanggil Bootstrap Icons (ikon) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh; /* Tinggi halaman satu layar penuh */
      background: linear-gradient(#0f2027, #203a43, #2c5364); /* Background gradasi */
      display: flex; /* Mengaktifkan flexbox */
      align-items: center; /* Posisi tengah vertikal */
      justify-content: center; /* Posisi tengah horizontal */
      color: white; /* Warna teks putih */
    }

    /* Mengatur tampilan kartu login */
    .login-card {
      background: rgba(255,255,255,0.1); /* Warna transparan */
      border-radius: 20px; /* Sudut melengkung */
      padding: 30px; /* Jarak dalam */
      width: 100%; /* Lebar penuh */
      max-width: 400px; /* Lebar maksimal */
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); /* Bayangan */
    }
  </style>
</head>
<body>
<!-- Container utama login -->
<div class="login-card text-center">
  <!-- Judul aplikasi -->
  <h3 class="fw-bold mb-2">Abidin Tech International</h3>
  <!-- Teks petunjuk -->
  <p class="mb-4">Login to continue</p>
  <!-- Input untuk username -->
  <input type="text" id="username" class="form-control mb-3" placeholder="Username"> 

  <!-- Input untuk password -->
  <input type="password" id="password" class="form-control mb-3" placeholder="Password">
  <!-- Tombol login -->
  <!-- onclick digunakan untuk memanggil function login() -->
  <button class="btn btn-primary w-100" onclick="login()">Login</button>
  <!-- Tempat menampilkan pesan error -->
  <p class="text-danger mt-3" id="message"></p></div>

<script>
  // Menyimpan data username dan password ke localStorage (simulasi database)
  localStorage.setItem("username", "student");
  localStorage.setItem("password", "12345");

  // Function login dijalankan saat tombol Login diklik
  function login() {
    // Mengambil nilai dari input username
    let inputUsername = document.getElementById("username").value;
    // Mengambil nilai dari input password
    let inputPassword = document.getElementById("password").value;

    // Mengambil username yang tersimpan di localStorage
    let savedUsername = localStorage.getItem("username");
    // Mengambil password yang tersimpan di localStorage
    let savedPassword = localStorage.getItem("password");

    // Percabangan untuk mengecek kecocokan data
    if (inputUsername === savedUsername && inputPassword === savedPassword) {
      // Jika username dan password benar, pindah ke halaman dashboard
      window.location.href = "dashboard.html";
    } else {
      // Jika salah, tampilkan pesan error
      document.getElementById("message").innerHTML =
        "Username or password is incorrect!";
    }
  }
</script>

</body>
</html>
